<!doctype html>
<html lang="es">
<head>

<script>
tailwind.config={theme:{extend:{colors:{bg:'var(--bg)',surface:'var(--surface)',surface2:'var(--surface2)',line:'var(--line)',fg:'var(--fg)',dim:'var(--dim)',accent:'var(--accent)',easy:'var(--easy)',normal:'var(--normal)',hard:'var(--hard)'},fontFamily:{display:['"Barlow Condensed"','"Arial Narrow"','sans-serif'],sans:['Barlow','system-ui','-apple-system','"Segoe UI"','sans-serif']}}}};
</script>
<style>
:root{--bg:#131A26;--surface:#1B2433;--surface2:#243047;--line:#303D57;--fg:#EEF2F8;--dim:#98A6BC;--accent:#F5B83D;--accent-ink:#221802;--easy:#35B77D;--normal:#4A8BF5;--hard:#E9564E;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#131A26;--surface:#1B2433;--surface2:#243047;--line:#303D57;--fg:#EEF2F8;--dim:#98A6BC}}
:root[data-theme="dark"]{--bg:#131A26;--surface:#1B2433;--surface2:#243047;--line:#303D57;--fg:#EEF2F8;--dim:#98A6BC}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--fg);font-family:Barlow,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}
button{cursor:pointer}
button:disabled{opacity:.4;cursor:not-allowed}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:10px}
img,svg{max-width:100%}
.appbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.brand{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-weight:800;font-size:1.75rem;letter-spacing:-.01em}
.brand b{color:var(--accent)}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--surface2);border:1px solid var(--line);display:grid;place-items:center;font-weight:700}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tab{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 0 10px;color:var(--dim);font-size:11px;font-weight:600;background:none;border:0}
.tab[aria-current="page"]{color:var(--accent)}
.hero{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-weight:800;font-size:clamp(3.2rem,15vw,5rem);line-height:.88;letter-spacing:-.015em;margin:.35rem 0 0}
.h1{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-weight:800;font-size:2.75rem;line-height:.95}
.h2{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-weight:700;font-size:1.6rem;line-height:1}
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px}
.row{display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:6px}
.row-main{flex:1;min-width:0;display:flex;align-items:center;gap:12px;text-align:left;padding:4px;border-radius:12px;background:none;border:0;color:inherit}
.mini{width:54px;height:54px;flex:none;background:var(--surface2);border-radius:12px}
.btn-primary{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:58px;padding:0 22px;border-radius:16px;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:1.15rem;border:0}
.btn-primary:active{transform:scale(.985)}
.btn-ghost{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:42px;padding:0 12px;border-radius:12px;background:var(--surface2);color:var(--fg);font-weight:600;font-size:.92rem;border:1px solid var(--line)}
.btn-text{display:inline-flex;align-items:center;gap:6px;min-height:42px;padding:0 10px;border-radius:12px;background:none;border:0;color:var(--dim);font-weight:600}
.btn-danger{color:var(--hard)}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.seg label{flex:1 1 auto;position:relative}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg span{display:flex;justify-content:center;align-items:center;min-height:46px;padding:0 14px;border-radius:12px;background:var(--surface2);border:1px solid var(--line);font-weight:600;cursor:pointer;white-space:nowrap}
.seg input:checked+span{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.seg input:focus-visible+span{outline:3px solid var(--accent);outline-offset:2px}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.days label{position:relative}
.days input{position:absolute;opacity:0;pointer-events:none}
.days span{display:flex;justify-content:center;align-items:center;min-height:46px;border-radius:12px;background:var(--surface2);border:1px solid var(--line);font-weight:600;font-size:.9rem;cursor:pointer}
.days input:checked+span{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.days input:focus-visible+span{outline:3px solid var(--accent);outline-offset:2px}
.field{display:block;width:100%;min-height:50px;padding:0 14px;border-radius:12px;background:var(--surface2);border:1px solid var(--line);color:var(--fg);font-size:1.05rem;font-family:inherit}
.lbl{display:block;font-weight:600;margin-bottom:8px}
.hint{font-size:.88rem;color:var(--dim);margin-top:6px}
.fig{width:100%;height:100%;display:block}
.fb,.fa{fill:none;stroke-width:8;stroke-linecap:round;stroke-linejoin:round}
.fb{stroke:#7E8CA3}.fa{stroke:var(--accent)}.bk{opacity:.5}
.fh{fill:#7E8CA3}
.fg{stroke:var(--line);stroke-width:3}
.fp{fill:var(--line)}.fl{stroke:var(--line);stroke-width:5;stroke-linecap:round}
.fc{stroke:var(--dim);stroke-width:2;stroke-dasharray:4 4}.fpc{fill:var(--surface);stroke:var(--dim);stroke-width:2}
.fplate{fill:var(--normal);stroke:var(--bg);stroke-width:2}.fhub{fill:var(--bg)}
.fdb{fill:var(--fg)}
.chip{display:inline-flex;align-items:center;min-height:30px;padding:0 12px;border-radius:999px;background:var(--surface2);border:1px solid var(--line);font-size:.9rem;font-weight:600}
.chip-a{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.tip{background:var(--surface2);border-left:4px solid var(--accent);border-radius:10px;padding:12px 14px}
.set{border:1px solid var(--line);border-radius:14px;padding:10px;background:var(--surface2)}
.set.is-cur{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.set.is-done{background:transparent}
.set-n{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:700;background:var(--bg);flex:none}
.num{width:78px;min-height:46px;text-align:center;border-radius:10px;background:var(--bg);border:1px solid var(--line);color:var(--fg);font-size:1.2rem;font-weight:700;font-variant-numeric:tabular-nums;font-family:inherit}
.rb{flex:1;min-height:46px;border-radius:10px;font-weight:700;border:2px solid;background:transparent;font-family:inherit;font-size:1rem}
.rb-easy{border-color:var(--easy);color:var(--easy)}.rb-ok{border-color:var(--normal);color:var(--normal)}.rb-hard{border-color:var(--hard);color:var(--hard)}
.rb-easy:hover{background:color-mix(in srgb,var(--easy) 16%,transparent)}.rb-ok:hover{background:color-mix(in srgb,var(--normal) 16%,transparent)}.rb-hard:hover{background:color-mix(in srgb,var(--hard) 16%,transparent)}
.badge{display:inline-flex;align-items:center;min-height:28px;padding:0 10px;border-radius:8px;font-weight:700;font-size:.88rem}
.b-easy{background:var(--easy);color:#04160d}.b-ok{background:var(--normal);color:#040f24}.b-hard{background:var(--hard);color:#230605}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block}
.d-easy{background:var(--easy)}.d-ok{background:var(--normal)}.d-hard{background:var(--hard)}
.segs{display:flex;gap:4px}
.sb{flex:1;height:7px;border-radius:4px;background:var(--line);border:0;padding:0}
.sb.done{background:var(--easy)}.sb.cur{background:var(--accent)}
.fig-lg{width:118px;height:118px;flex:none;background:var(--surface2);border-radius:16px;border:0;padding:0}
.fig-xl{width:100%;max-width:260px;aspect-ratio:1;margin:0 auto;background:var(--surface2);border-radius:20px}
.fig-xl.has-photo{max-width:100%;aspect-ratio:3/2;overflow:hidden}
.exph{position:relative;display:block;overflow:hidden;background:#fff}
.exph.fig{width:100%;height:100%;border-radius:inherit}
.exph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.fig-xl .exph img{object-fit:contain;background:#fff}
.exph .b{opacity:0;animation:exfade 3s infinite}
@keyframes exfade{0%,40%{opacity:0}50%,90%{opacity:1}100%{opacity:0}}
.layer{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center;background:rgba(5,8,14,.72)}
.sheet{width:100%;max-width:560px;max-height:92vh;max-height:92dvh;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:24px 24px 0 0;padding:18px 20px calc(24px + env(safe-area-inset-bottom,0px));animation:up .22s ease-out}
@media (min-width:640px){.layer{align-items:center;padding:24px}.sheet{border-radius:24px}}
@keyframes up{from{transform:translateY(28px);opacity:0}}
.alt{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:16px;padding:6px;background:var(--surface2)}
.alt.is-cur{border-color:var(--accent)}
.tlayer{position:fixed;inset:0;z-index:60;display:flex;align-items:flex-end;justify-content:center;background:rgba(5,8,14,.8)}
@media (min-width:640px){.tlayer{align-items:center}}
.tsheet{width:100%;max-width:440px;background:var(--surface);border:1px solid var(--line);border-radius:28px 28px 0 0;padding:22px 20px calc(24px + env(safe-area-inset-bottom,0px));text-align:center;animation:up .22s ease-out}
@media (min-width:640px){.tsheet{border-radius:28px}}
.plate{width:230px;height:230px;margin:6px auto 0;display:block}
.pl-body{fill:var(--surface2);stroke:var(--line);stroke-width:2}
.pl-track{fill:none;stroke:var(--bg);stroke-width:14}
.pl-prog{fill:none;stroke:var(--accent);stroke-width:14;stroke-linecap:round;transition:stroke-dashoffset .2s linear}
.pl-face{fill:var(--surface)}
.pl-bolt{fill:var(--line)}
.pl-time{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-weight:800;font-size:58px;fill:var(--fg)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(86px + env(safe-area-inset-bottom,0px));z-index:70;background:var(--fg);color:var(--bg);font-weight:600;padding:12px 16px;border-radius:14px;max-width:calc(100% - 32px);animation:up .2s ease-out}
.scroll-x{overflow-x:auto}
details>summary{list-style:none;cursor:pointer}
details>summary::-webkit-details-marker{display:none}
.chev{transition:transform .2s}
details[open] .chev{transform:rotate(180deg)}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px}
.stat b{display:block;font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-size:2rem;font-weight:800;line-height:1}
.stat span{font-size:.85rem;color:var(--dim)}
.wk{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.wk-d{flex:1 0 auto;min-width:86px;border:1px solid var(--line);border-radius:14px;padding:10px;background:var(--surface)}
.wk-d.is-next{border-color:var(--accent)}
.wk-d.is-done{background:color-mix(in srgb,var(--easy) 14%,var(--surface));border-color:color-mix(in srgb,var(--easy) 50%,var(--line))}
/* Pulsómetro */
.hrpill{min-height:28px;padding:0 10px;border-radius:999px;border:1px solid var(--line);background:var(--surface2);color:var(--dim);font-weight:700;font-size:.78rem;font-family:inherit;white-space:nowrap;max-width:52vw;overflow:hidden;text-overflow:ellipsis}
.hrpill.is-on{color:var(--hard);border-color:color-mix(in srgb,var(--hard) 50%,var(--line))}
/* Semana dinámica */
.wkrow{display:flex;align-items:center;gap:12px;width:100%;min-height:48px;padding:6px 8px;border-radius:12px;background:none;border:1px solid transparent;color:inherit;font:inherit;text-align:left}
.wkrow:hover{background:var(--surface2)}.wkrow.is-today{border-color:var(--accent)}
.chip-match{background:var(--normal);color:#040f24;border-color:var(--normal)}
.wk-d.is-match{border-color:var(--normal)}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
/* Lesiones */
.bodywrap{background:var(--bg);border-radius:16px;padding:8px}
.bodymap{width:100%;max-width:280px;height:auto;max-height:440px;display:block;margin:0 auto}
.sil{fill:var(--surface2);stroke:var(--line);stroke-width:1.5}
.mz{fill:color-mix(in srgb,var(--dim) 38%,var(--surface2));stroke:var(--bg);stroke-width:1;cursor:pointer;transition:fill .15s,opacity .2s}
.mz:hover{fill:var(--dim)}
.mz-off{opacity:.22;pointer-events:none}
.mz-on{fill:color-mix(in srgb,var(--fg) 55%,var(--surface2))}
.mz-mild{fill:var(--accent)}.mz-hurt{fill:var(--hard)}
.chip-hurt{border-color:var(--hard);color:var(--hard)}
.pain{display:grid;grid-template-columns:repeat(10,1fr);gap:4px}
.pain label{position:relative}.pain input{position:absolute;opacity:0;pointer-events:none}
.pain span{display:flex;justify-content:center;align-items:center;min-height:42px;border-radius:10px;background:var(--surface2);border:1px solid var(--line);font-weight:700;cursor:pointer}
.pain input:checked+span{background:var(--hard);color:#230605;border-color:var(--hard)}
.pain input:focus-visible+span{outline:3px solid var(--accent);outline-offset:2px}
.rpe input:checked+span{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.check{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:12px;background:var(--surface2);border:1px solid var(--line);cursor:pointer}
.check input{width:20px;height:20px;margin-top:2px;accent-color:var(--hard);flex:none}
/* Sesión por bloques */
.steps{display:flex;gap:6px}
.step{flex:1;min-height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--dim);font-weight:700;font-size:.85rem;font-family:inherit;padding:0 4px}
.step.cur{border-color:var(--accent);color:var(--accent)}
.step.done{background:color-mix(in srgb,var(--easy) 16%,var(--surface));color:var(--easy);border-color:color-mix(in srgb,var(--easy) 50%,var(--line))}
.seq{position:fixed;inset:0;z-index:65;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 20px calc(24px + env(safe-area-inset-bottom,0px));text-align:center;transition:background .3s}
.seq-lbl{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-weight:800;font-size:clamp(2.6rem,12vw,4rem);line-height:.95;margin-top:10px}
.seq-time{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-weight:800;font-size:clamp(5rem,28vw,9rem);line-height:1;margin-top:8px}
.seq-track{width:100%;max-width:24rem;height:8px;border-radius:4px;background:rgba(127,127,127,.3);margin-top:8px;overflow:hidden}
.seq-bar{height:100%;width:0;background:currentColor}
.seq-btn{min-height:50px;border-radius:14px;border:2px solid currentColor;background:transparent;color:inherit;font-weight:700;font-size:1rem;font-family:inherit}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>

<script>


/* ============ Estado (localStorage, multiusuario) ============ */
const KEY='forja.v1';
let S={version:2,activeUser:null,users:{},deleted:{}};
try{const raw=localStorage.getItem(KEY);if(raw){const d=JSON.parse(raw);if(d&&d.users)S=d}}catch(e){}
Object.values(S.users).forEach(migrateUser);S.version=2;
function saveLocal(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function save(){const u=S.users[S.activeUser];if(u)u.updatedAt=Date.now();saveLocal();schedulePush()}
let saveT;function saveSoon(){clearTimeout(saveT);saveT=setTimeout(save,300)}
const U=()=>S.users[S.activeUser]||null;
let view='home',swapCtx=null,infoCtx=null;

/* ============ Utilidades ============ */
const $=s=>document.querySelector(s);
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function toast(msg){const t=$('#toast');t.innerHTML=`<div class="toast" role="status">${esc(msg)}</div>`;clearTimeout(toast.t);toast.t=setTimeout(()=>t.innerHTML='',2600)}
const ICON={
 today:'<path d="M6 7v10M18 7v10M3 10v4M21 10v4M6 12h12"/>',
 plan:'<rect x="3" y="4" width="18" height="17" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/>',
 hist:'<path d="M3 3v18h18"/><path d="M8 16v-4M13 16V8M18 16v-7"/>',
 user:'<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/>',
 swap:'<path d="M7 20V4M3 8l4-4 4 4M17 4v16M13 16l4 4 4-4"/>',
 close:'<path d="M6 6l12 12M18 6 6 18"/>',
 chev:'<path d="m6 9 6 6 6-6"/>',
 play:'<path d="M7 4v16l13-8z"/>',
 body:'<rect x="3" y="4" width="18" height="16" rx="4"/><path d="M8 10a5 5 0 0 1 8 0M12 10l2-2"/>',
 cross:'<path d="M9 3h6v6h6v6h-6v6H9v-6H3V9h6z"/>',
 bell:'<path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9M10 21a2 2 0 0 0 4 0"/>'
};
const ic=(n,s=22)=>`<svg viewBox="0 0 24 24" width="${s}" height="${s}" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICON[n]}</svg>`;

const hhmm=t=>new Date(t).toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'});
function fmtSigned(sec){return (sec<0?'−':'+')+fmtDur(Math.abs(sec)*1000)}
function itemsEst(a){return a.items.reduce((s,it)=>s+it.sets.length*(WORK+it.p.rest),0)}
function blockSec(a){return {mob:(a.mob?a.mob.list:[]).reduce((t,id)=>t+((MOBM[id]||{}).sec||0)+10,0),st:(a.stretch?a.stretch.list:[]).reduce((t,id)=>t+((STRM[id]||{}).sec||0),0),cond:a.cond?a.cond.min*60:0}}
function clock(){const a=U().active,now=Date.now(),est=a.est||itemsEst(a),el=(now-a.start)/1000,b=blockSec(a);
 let credit=(a.mob&&a.mob.done?b.mob:0)+(a.cond&&a.cond.done?b.cond:0)+(a.stretch&&a.stretch.done?b.st:0);
 a.items.forEach(it=>it.sets.forEach(s=>{if(s.rt)credit+=WORK+it.p.rest}));
 if(T)credit-=Math.max(0,(T.end-now)/1000);
 credit=Math.max(0,Math.min(est,credit));
 return {est,el,credit,left:est-el,remPlan:Math.max(0,est-credit),pace:credit-el}}
function updClock(){const u=U();if(!u||!u.active||!$('#cd'))return;const c=clock();
 const cd=$('#cd');cd.textContent=c.left>=0?fmtDur(c.left*1000):fmtSigned(-c.left);cd.style.color=c.left>=0?'':'var(--hard)';
 $('#cd-l').textContent=c.left>=0?'quedan (estimado)':'sobre lo estimado';
 $('#pct').textContent=Math.round(c.credit/c.est*100)+' %';

 for(let j=k+1;j<it.sets.length;j++){const n=it.sets[j];if(n.rt)continue;n.w=set.w;n.r=+set.r||n.r;
  if(r==='easy'){if(ex.eq!=='body'&&set.w>0&&n.r>=it.p.max)n.w=rnd(set.w+I);else n.r+=step}
  if(r==='hard')n.r=Math.max(ex.time?10:1,n.r-step)}

 if(rem>=0)next=`Serie ${rem+1} de ${it.sets.length}, ${ex.n}`;

 if(ws.length)g.w=Math.max(...ws);

 const step=ex.time?5:1,I=inc(ex),weighted=ex.eq!=='body'&&g.w>0,un=unit(ex);let note;
 if(avg<=-.5){if(weighted){g.w=rnd(g.w+I);g.r=Math.min(Math.max(g.r,p.min),p.max);note=`+${fmtKg(I)} kg`}else{g.r+=2*step;note=`+${2*step} ${un}`}}
 else if(avg<.5){if(weighted&&g.r+step>p.max){g.w=rnd(g.w+I);g.r=p.min;note=`+${fmtKg(I)} kg, vuelves a ${p.min} ${un}`}else{g.r+=step;note=`+${step} ${un}`}}
 else{if(avg>=1&&weighted){g.w=rnd(Math.max(0,g.w-I));g.r=p.min;note=`−${fmtKg(I)} kg`}else{g.r=Math.max(ex.time?10:1,g.r-step);note=`−${step} ${un}`}}
